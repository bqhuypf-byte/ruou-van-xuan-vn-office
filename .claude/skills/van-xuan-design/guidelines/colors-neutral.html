<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:130px;font-family:var(--font-sans)">
<div style="flex:1;background:var(--surface);border:1px solid var(--border);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--ink)">surface</div>
<div style="flex:1;background:var(--surface-alt);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--ink)">surface-alt</div>
<div style="flex:1;background:var(--slate-200);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--ink)">border</div>
<div style="flex:1;background:var(--slate-500);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">muted</div>
<div style="flex:1;background:var(--ink);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">ink / 900</div>
<div style="flex:1;background:var(--surface-inverse);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">surface-inverse</div>
</div>
