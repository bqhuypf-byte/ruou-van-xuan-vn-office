<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="danger, success, warning, info, rating" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(5,1fr);height:130px;font-family:var(--font-sans);font-size:11px">
<div style="background:var(--danger);color:#fff;display:flex;align-items:flex-end;padding:8px">danger<br>rose-600</div>
<div style="background:var(--success);color:#fff;display:flex;align-items:flex-end;padding:8px">success<br>emerald-600</div>
<div style="background:var(--amber-400);color:var(--amber-950);display:flex;align-items:flex-end;padding:8px">rating<br>amber-400</div>
<div style="background:var(--warning-subtle);color:var(--warning-subtle-text);border:1px solid var(--warning-subtle-border);display:flex;align-items:flex-end;padding:8px">warning subtle</div>
<div style="background:var(--info-subtle);color:var(--info-subtle-text);border:1px solid var(--info-subtle-border);display:flex;align-items:flex-end;padding:8px">info subtle</div>
</div>
