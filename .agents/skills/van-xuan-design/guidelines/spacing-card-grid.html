<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:var(--grid-gap)">
<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-2xl);padding:var(--card-p);box-shadow:var(--shadow-sm);font-size:12px;color:var(--muted)">card-p (20px)</div>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-2xl);padding:var(--card-p);box-shadow:var(--shadow-sm);font-size:12px;color:var(--muted)">grid-gap (20px)</div>
</div>
