name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      product_seo_payload_b64:
        description: Optional base64-encoded product SEO batch
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          script: |
            cd /root/app
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            if [ -n '${{ inputs.product_seo_payload_b64 }}' ]; then
              docker compose exec -T \
                -e PRODUCT_SEO_APPLY_CONFIRM=APPLY \
                backend node dist/scripts/apply-product-seo.js \
                '${{ inputs.product_seo_payload_b64 }}'
            fi
            docker image prune -f
