<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo mobile — Rượu Vạn Xuân</title>
    <style>
      :root { --brand:#003d29; --ink:#10251d; --muted:#64748b; --line:#e2e8f0; --soft:#f4f8f5; --wine:#652f35; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#e9eeeb; color:var(--ink); font-family:"Be Vietnam Pro",Arial,sans-serif; }
      .stage { min-height:100vh; display:grid; place-items:center; padding:24px; }
      .phone { width:min(390px,100%); min-height:820px; overflow:hidden; background:#fff; border:8px solid #10251d; border-radius:38px; box-shadow:0 24px 60px #163b2d45; position:relative; }
      .status { height:24px; background:var(--brand); color:#fff; padding:4px 18px; display:flex; justify-content:space-between; font-size:10px; }
      header { position:sticky; top:0; z-index:3; background:#fff; border-bottom:1px solid var(--line); }
      .header-row { height:62px; display:flex; align-items:center; gap:8px; padding:0 12px; }
      button { font:inherit; cursor:pointer; } .icon-btn { width:38px; height:38px; border:0; border-radius:11px; background:transparent; color:var(--brand); display:grid; place-items:center; }
      .icon-btn:hover { background:var(--soft); } svg { width:21px; height:21px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .brand { flex:1; min-width:0; display:flex; align-items:center; gap:8px; color:var(--brand); font-weight:800; font-size:17px; white-space:nowrap; overflow:hidden; }
      .mark { width:32px; height:32px; border-radius:10px; color:#fff; background:var(--brand); display:grid; place-items:center; font-size:11px; flex:none; }
      .cart { position:relative; } .count { position:absolute; top:3px; right:2px; width:15px; height:15px; border-radius:99px; background:#e11d48; color:#fff; font-size:9px; display:grid; place-items:center; }
      .search { display:none; padding:0 12px 12px; } .search.open { display:block; } .searchbox { height:43px; display:flex; gap:8px; align-items:center; padding:0 12px; border:1px solid #b8cec4; border-radius:12px; background:#fbfdfb; color:var(--muted); font-size:13px; }
      main { padding-bottom:74px; } .hero { margin:14px 12px 24px; min-height:246px; padding:28px 22px; border-radius:22px; background:#d2f7ec; position:relative; overflow:hidden; }
      .eyebrow { color:#1e6d50; font-size:11px; text-transform:uppercase; font-weight:800; letter-spacing:.07em; margin:0; } h1 { margin:9px 0; max-width:220px; font-size:27px; line-height:1.12; letter-spacing:-.03em; } .hero p { max-width:205px; color:#31584a; font-size:13px; line-height:1.5; }
      .bottle { position:absolute; right:-10px; bottom:-20px; width:128px; height:207px; border:13px solid #efe5c8; border-radius:24px 24px 38px 38px; background:var(--wine); transform:rotate(11deg); box-shadow:inset 0 0 0 7px #8c5050, 0 12px 20px #0002; } .bottle:before { content:""; position:absolute; left:35px; top:-72px; width:34px; height:68px; border-radius:9px 9px 0 0; background:#e9debf; } .bottle:after { content:"VẠN\A XUÂN"; white-space:pre; position:absolute; top:59px; left:15px; width:68px; height:60px; padding-top:12px; background:#f7edd4; color:var(--brand); text-align:center; font-size:11px; font-weight:800; line-height:1.2; }
      .cta { position:relative; z-index:1; border:0; min-height:43px; border-radius:99px; padding:0 18px; background:var(--brand); color:#fff; font-weight:700; font-size:13px; }
      .section { padding:0 12px; } .heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; } h2 { margin:0; font-size:18px; } .link { border:0; background:none; color:var(--brand); font-size:12px; font-weight:700; }
      .chips { display:flex; gap:8px; overflow:auto; margin:0 -12px 22px; padding:0 12px; scrollbar-width:none; } .chip { white-space:nowrap; border:1px solid var(--line); background:#fff; border-radius:99px; padding:8px 12px; color:#435a50; font-size:12px; } .chip.active { background:var(--brand); border-color:var(--brand); color:#fff; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .card { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fff; } .photo { height:130px; display:grid; place-items:center; background:#f5f1ec; } .mini-bottle { position:relative; width:48px; height:85px; border:5px solid #ebdfbc; border-radius:11px 11px 17px 17px; background:var(--wine); box-shadow:inset 0 0 0 3px #8c5050; } .mini-bottle:before { content:""; position:absolute; top:-27px; left:12px; width:15px; height:25px; border-radius:4px 4px 0 0; background:#e9debf; } .mini-bottle:after { content:"VX"; position:absolute; left:7px; top:26px; width:24px; height:22px; padding-top:3px; background:#f7edd4; color:var(--brand); font-size:8px; font-weight:800; text-align:center; } .card-body { padding:10px; } .name { min-height:35px; font-size:12px; line-height:1.4; font-weight:700; } .price { margin:6px 0 9px; color:var(--brand); font-weight:800; font-size:13px; } .add { width:100%; min-height:34px; border:1px solid var(--brand); border-radius:99px; background:#fff; color:var(--brand); font-size:11px; font-weight:800; }
      .bottom { position:absolute; z-index:4; left:0; right:0; bottom:0; height:65px; padding:7px 20px; border-top:1px solid var(--line); background:#fff; display:flex; justify-content:space-between; } .navitem { width:56px; border:0; background:transparent; color:var(--muted); display:grid; justify-items:center; gap:2px; font-size:9px; } .navitem.active { color:var(--brand); font-weight:800; } .navitem svg { width:19px; height:19px; }
      .quick-actions { position:absolute; z-index:5; right:14px; bottom:82px; display:flex; flex-direction:column; align-items:flex-end; gap:9px; } .quick-action { min-height:38px; border:0; border-radius:99px; padding:0 13px 0 10px; display:flex; align-items:center; gap:7px; color:#fff; box-shadow:0 8px 18px #10251d26; font-size:12px; font-weight:800; } .quick-action svg { width:17px; height:17px; } .quick-offer { background:#e11d48; } .quick-contact { background:var(--brand); } .quick-action:hover { filter:brightness(.92); }
      .drawer { display:none; position:absolute; z-index:7; inset:24px 0 0; background:#0006; } .drawer.open { display:block; } .panel { width:84%; height:100%; padding:18px; background:#fff; box-shadow:12px 0 30px #0003; } .drawer-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:16px; border-bottom:1px solid var(--line); font-weight:800; } .menu-link { width:100%; display:flex; align-items:center; justify-content:space-between; padding:16px 2px; border:0; border-bottom:1px solid #edf1ee; background:#fff; color:var(--ink); text-align:left; font-size:14px; }
      @media (max-width:430px) { .stage { padding:0; } .phone { width:100%; min-height:100vh; border:0; border-radius:0; } }
    </style>
  </head>
  <body>
    <div class="stage"><div class="phone">
      <div class="status"><span>9:41</span><span>● ● ●</span></div>
      <header>
        <div class="header-row">
          <button class="icon-btn" onclick="toggleMenu()" aria-label="Mở danh mục"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="brand"><div class="mark">VX</div><span>Rượu Vạn Xuân</span></div>
          <button class="icon-btn" onclick="toggleSearch()" aria-label="Tìm kiếm"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg></button>
          <button class="icon-btn cart" aria-label="Giỏ hàng"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h10l2-7H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg><span class="count">2</span></button>
        </div>
        <div class="search" id="search"><div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span>Tìm rượu vang, rượu ngâm...</span></div></div>
      </header>
      <main>
        <section class="hero"><p class="eyebrow">Bộ sưu tập mới</p><h1>Hương vị truyền thống, trọn vẹn tinh hoa</h1><p>Rượu Việt được chưng cất cẩn trọng cho mỗi dịp sum vầy.</p><button class="cta">Khám Phá Sản Phẩm</button><div class="bottle" aria-hidden="true"></div></section>
        <section class="section"><div class="heading"><h2>Rượu Được Ưa Chuộng</h2><button class="link">Xem Tất Cả</button></div><div class="chips"><button class="chip active">Tất Cả</button><button class="chip">Rượu Gạo</button><button class="chip">Rượu Nếp</button><button class="chip">Rượu Vang</button></div><div class="grid">
          <article class="card"><div class="photo"><div class="mini-bottle"></div></div><div class="card-body"><div class="name">Rượu Nếp Vạn Xuân 40 Độ</div><div class="price">155.000đ</div><button class="add">Thêm Vào Giỏ</button></div></article>
          <article class="card"><div class="photo"><div class="mini-bottle"></div></div><div class="card-body"><div class="name">Rượu Nếp Than Vạn Xuân</div><div class="price">185.000đ</div><button class="add">Thêm Vào Giỏ</button></div></article>
        </div></section>
      </main>
      <nav class="bottom"><button class="navitem active"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>Trang Chủ</button><button class="navitem"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>Danh Mục</button><button class="navitem"><svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>Tài Khoản</button></nav>
      <div class="quick-actions" aria-label="Liên hệ nhanh">
        <button class="quick-action quick-offer"><svg viewBox="0 0 24 24"><path d="M3 9v6h18V9zM8 9V7a2 2 0 0 1 4 0v2M12 9V7a2 2 0 0 1 4 0v2M3 12h18"/></svg>Ưu Đãi</button>
        <button class="quick-action quick-contact"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4A8 8 0 1 1 20 11.5z"/></svg>Liên Hệ</button>
      </div>
      <div class="drawer" id="drawer" onclick="if(event.target===this)toggleMenu()"><aside class="panel"><div class="drawer-head"><span>Danh Mục Sản Phẩm</span><button class="icon-btn" onclick="toggleMenu()" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><button class="menu-link">Rượu Gạo <span>›</span></button><button class="menu-link">Rượu Nếp <span>›</span></button><button class="menu-link">Rượu Vang <span>›</span></button><button class="menu-link">Quà Biếu <span>›</span></button></aside></div>
    </div></div>
    <script>function toggleMenu(){document.getElementById('drawer').classList.toggle('open')}function toggleSearch(){document.getElementById('search').classList.toggle('open')}</script>
  </body>
</html>
