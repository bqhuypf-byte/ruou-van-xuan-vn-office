# Plain HTTP: only serves ACME challenge for cert issuance/renewal, redirects everything else to HTTPS
server {
    listen 80;
    server_name ruouvanxuan.com www.ruouvanxuan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ruouvanxuan.com www.ruouvanxuan.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ruouvanxuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruouvanxuan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached — it points at the content-hashed JS/CSS
    # bundles, so a stale copy pins the browser to an old deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded product images/videos served by the backend
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Static asset caching
    location ~* \.(?:css|js|woff2?|ttf|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
